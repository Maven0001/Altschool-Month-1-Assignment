<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AltSchool Africa application form">
    <title>AltSchool Application Form</title>
</head>

<body>

    <header>
        <nav aria-label="Global navigation">
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="form.html" aria-current="page">
                        Application Form
                    </a>
                </li>
            </ul>
        </nav>

        <h1>Sign Up</h1>

        <p>
Create an account to get started on your learning journey        </p>
    </header>

    <main id="main-content">

        <form action="#" method="post">

            
                

                <p>
                    <label for="email">Email address</label>
                    <br>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        
                        placeholder="you@example.com"
                        required
                    >
                </p>

                <p>
                    <label for="lastName">Last Name</label>
                    <br>

                    <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        
                        placeholder="Ayinde"
                        required
                    >
                </p>

                <p>
                    <label for="firstName">First name</label>
                    <br>

                    <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        
                        placeholder="Ibrahim"
                        required
                    >
                </p>

                 <p>
                    <label for="phone">Phone number</label>
                    <br>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        
                        placeholder="08000000000"
                        required
                    >
                </p>

                <p>
                    <label for="password">Password</label>
                    <br>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        
                        
                        required
                    >
                </p>

                <p>By clicking Create account, I agree to Terms of Use and acknowledge that I have read the Privacy Policy.</p>

              

            

           

            
            <p>
                <button type="submit">
                    Create Account
                </button>

               

        </form>

    </main>

    <footer>
        <address>
            Lagos, Nigeria
        </address>

        <p>
            &copy; 2026 Ibrahim Ayinde. All rights reserved.
        </p>
    </footer>

</body>
</html>
